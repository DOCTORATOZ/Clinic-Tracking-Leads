name: Preview readiness
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn test:harness
      - run: yarn playwright install --with-deps chromium
      # Both runners create isolated local fixtures. No remote secrets or db reset.
      - run: yarn test:upgrade
      - run: yarn test:integration
      - run: yarn build
        env:
          NEXT_DIST_DIR: .next-contract-build
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-not-a-real-key
          CALENDAR_SYNC_ENABLED: 'false'
